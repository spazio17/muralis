# Release: run by hand, from main only. Tags the current commit with the semantic version you
# type, builds the debug APK (for the panels) and the release AAB (signed with the upload key,
# for Play Console), and attaches both to a GitHub Release, which unlike a CI artifact never
# expires. The Play upload itself stays manual: Play requires the AAB, and the very first upload
# of a new app must go through the Console UI anyway because it is what creates the app and
# enrols Play App Signing.
#
# The version is typed by a human on purpose: the semver digits carry meaning (breaking, feature,
# fix) that automation cannot know. The tag this creates is what git describe then reports on
# every later build, so the version installed on a device always names its commit.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to release, e.g. 0.2.0 (tags this commit as v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Refuse to release anything but main
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Releases come from main; this ran on $GITHUB_REF_NAME." >&2
            exit 1
          fi

      - name: Validate and create the tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "Not a semantic version: $VERSION (expected e.g. 0.2.0)" >&2; exit 1; }
          git config user.name 'Juri Calleri'
          git config user.email 'juricalleri@gmail.com'
          git tag -a "v$VERSION" -m "Muralis $VERSION"
          git push origin "v$VERSION"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Same Gradle cache as ci.yml; a release build downloads the same wrapper and
          # dependencies otherwise.
          cache: 'gradle'

      - name: Host tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils
          scripts/test-host.sh

      # The bundled legal texts are verbatim copies of the canonical files in the public
      # muralis-site repo (single source of truth, decided 2026-08-25). A release must not
      # ship with the app text behind the site, so this byte-compares against that repo's
      # main branch, not against the deployed Pages URL, which can lag behind a merge.
      - name: Legal texts must match the canonical muralis-site copies
        run: |
          for name in privacy.txt terms.txt; do
            curl -fsSL --retry 3 \
              "https://raw.githubusercontent.com/spazio17/muralis-site/main/legal/$name" \
              -o "$RUNNER_TEMP/$name"
            cmp "app/src/main/res/raw/$name" "$RUNNER_TEMP/$name" || {
              echo "res/raw/$name differs from muralis-site legal/$name." >&2
              echo "Edit the canonical text in muralis-site, run scripts/sync-legal.sh here, and merge both before releasing." >&2
              exit 1
            }
          done

      - name: Restore the signing keys
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          # Checked here as well as used in the build step below. The release signingConfig
          # needs the keystore file AND this password; with the password missing it quietly
          # leaves signingConfig unset, and the build still succeeds and still produces
          # `muralis-<version>.aab` under the usual name. That artifact is unsigned, which
          # Play only tells you at upload. Fail here instead, where the reason is legible.
          MURALIS_KEYSTORE_PASSWORD: ${{ secrets.MURALIS_KEYSTORE_PASSWORD }}
        run: |
          for name in DEBUG_KEYSTORE_B64 UPLOAD_KEYSTORE_B64 MURALIS_KEYSTORE_PASSWORD; do
            if [ -z "$(eval "printf '%s' \"\$$name\"")" ]; then
              echo "$name secret is missing." >&2; exit 1
            fi
          done
          mkdir -p .gradle
          printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > .gradle/kiosk-debug.keystore
          printf '%s' "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/muralis-upload.p12"

      - name: Build the APK and the AAB
        env:
          MURALIS_KEYSTORE: ${{ runner.temp }}/muralis-upload.p12
          MURALIS_KEYSTORE_PASSWORD: ${{ secrets.MURALIS_KEYSTORE_PASSWORD }}
          MURALIS_KEY_ALIAS: muralis-upload
        run: ./gradlew --no-daemon assembleDebug bundleRelease

      # Checks the artifact rather than the inputs: a keystore at the wrong path or an alias
      # that is not in it lands here too, and every one of those still produces a plausible
      # `muralis-<version>.aab`. A bundle is JAR-signed, so a signed one carries the
      # signature block next to the manifest.
      - name: The AAB must be signed
        run: |
          unzip -l app/build/outputs/bundle/release/app-release.aab \
            | grep -qE 'META-INF/.*\.(RSA|EC|DSA)$' || {
              echo "The AAB is unsigned; Play would reject it at upload." >&2; exit 1; }

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "muralis-$VERSION-debug.apk"
          cp app/build/outputs/bundle/release/app-release.aab "muralis-$VERSION.aab"
          gh release create "v$VERSION" \
            --title "Muralis $VERSION" \
            --notes "Debug APK for the panels (adb install -r), AAB for Play Console." \
            "muralis-$VERSION-debug.apk" "muralis-$VERSION.aab"
