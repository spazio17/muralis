# CI: every pull request and every push to main runs the host tests, Android lint and an
# unsigned release build (the shrunk build Play gets, so a minify problem shows before a release).
# No debug APK: the panels get theirs from scripts/build-app.sh, with the Pro override.
#
# Not on every push to every branch: a branch is built once it has a pull request, and each
# stacked PR's push was otherwise built twice (as a branch and again after the merges into it).
# A newer push to the same pull request cancels the run it makes pointless; runs on main always
# finish. Pull requests from forks (contributed integrations) are built and tested by
# integration-contribution.yml instead, so this workflow skips them.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: versionName comes from git describe and versionCode from the commit
          # count, so a shallow clone would produce a wrong version, not a faster build.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Caches ~/.gradle (wrapper distribution and dependencies), keyed on the Gradle
          # files. Without it every run re-downloaded both inside the build steps, which
          # was most of a minute of the ~3 the whole job takes.
          cache: 'gradle'

      - name: Host tests
        run: |
          # xmllint only; the runner image usually ships it, and apt-get update alone cost
          # ~20 seconds per run when it does.
          command -v xmllint >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libxml2-utils
          }
          scripts/test-host.sh

      - name: Lint
        run: ./gradlew --no-daemon lint

      # Unsigned without the release secrets, which is fine: the point is that the shrunk,
      # ProGuard-processed build is exercised on the push that breaks it (a keep rule that stops
      # covering Paho, a resource the shrinker drops) rather than discovered on release day.
      - name: Build the release APK
        run: ./gradlew --no-daemon assembleRelease
