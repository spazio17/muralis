org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# The app's own UI is framework-only on purpose; this is not a migration. True because the Play
# Billing client (the one AndroidX consumer here) ships AndroidX transitives, and AGP refuses the
# classpath otherwise.
android.useAndroidX=true
android.nonTransitiveRClass=true
