plugins {
    id 'com.android.application'
}

// The app's version identity comes from git, not from numbers edited here, so every build is
// traceable to an exact commit and nobody has to remember to bump anything:
//
//   versionName = git describe: "0.1.0" exactly on the tag v0.1.0, "0.1.0-7-ga1b2c3d" seven
//                 commits later, "-dirty" appended for an uncommitted tree.
//   versionCode = the commit count, which only ever grows, which is all Android requires of it.
//
// The semantic version is decided by a human pushing a tag (v0.2.0), never by automation: the
// digits carry meaning (breaking/feature/fix) that a robot bumping per push cannot know.
//
// Resolution order: environment first, because the containerized build has no git and
// scripts/gradle.sh computes both values on the host; then git directly, which is what CI and any
// ordinary checkout use; then a fallback that is obviously not a release.
def execGit = { List<String> gitArgs ->
    try {
        def command = (['git'] + gitArgs).execute(null, rootDir)
        def out = command.inputStream.text.trim()
        return command.waitFor() == 0 && !out.isEmpty() ? out : null
    } catch (Exception ignored) {
        return null
    }
}
def muralisVersionName = System.getenv('MURALIS_VERSION_NAME')
        ?: execGit(['describe', '--tags', '--always', '--dirty'])?.replaceFirst(/^v/, '')
        ?: '0.0.0-unknown'
def muralisVersionCode = (System.getenv('MURALIS_VERSION_CODE')
        ?: execGit(['rev-list', '--count', 'HEAD'])
        ?: '1') as Integer

// The app's licensing PUBLIC key, from Play Console (Monetization setup, Licensing). Used by
// PurchaseSignature to check that a purchase document really came from Play.
//
// Passed in rather than committed, the same way the version and the upload key are, and for the
// same reason: it is an account-specific value that a fork or a rebuild should not silently
// inherit. It is genuinely public (it ships inside every APK and anyone can extract it), so this
// is about provenance rather than secrecy.
//
// Absent means no purchase can be verified, which means Pro never unlocks. That is correct for a
// development build and catastrophic for a shipped one, so a SIGNED release refuses below rather
// than shipping an app nobody can ever unlock.
//
// Whitespace is stripped because Play Console prints the key wrapped across lines: pasted into a
// CI secret verbatim, the newlines would otherwise land inside the generated BuildConfig string
// literal, which is a syntax error three steps removed from its cause. Base64 has no whitespace,
// so this cannot damage a correct value.
def muralisLicenseKey = (System.getenv('MURALIS_LICENSE_KEY') ?: '').replaceAll(/\s+/, '')

// Debug-only override to force the entitlement on or off ("on"/"off"), so both the free and the
// paid paths can be exercised on real hardware. Read by ProEntitlement inside a BuildConfig.DEBUG
// branch, so R8 strips it from a release build entirely.
def muralisProOverride = System.getenv('MURALIS_PRO_OVERRIDE') ?: ''

android {
    namespace 'org.spazio17.muralis'

    signingConfigs {
        // The upload key, kept OUTSIDE this repository and outside the gitignored
        // .gradle/ bind mount, which build-container.sh is documented as regenerating.
        // scripts/gradle.sh mounts it read-only at /keys when it exists and passes the
        // password through the environment, so nothing secret is ever a file in the tree.
        //
        // Under Play App Signing this is the *upload* key: Google re-signs what it
        // distributes with an app signing key it holds, and can reset a lost upload key.
        // So losing this file costs a support round trip, not the app.
        //
        // Absent on a machine that has not been given the key, which is deliberate:
        // assembleRelease still runs and still shrinks, it just produces an unsigned APK,
        // so anyone can reproduce and test the release build without the secret.
        release {
            def keystore = file(System.getenv('MURALIS_KEYSTORE') ?: '/keys/muralis-upload.p12')
            if (keystore.exists() && System.getenv('MURALIS_KEYSTORE_PASSWORD')) {
                storeFile keystore
                storeType 'PKCS12'
                storePassword System.getenv('MURALIS_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MURALIS_KEY_ALIAS') ?: 'muralis-upload'
                keyPassword System.getenv('MURALIS_KEY_PASSWORD')
                        ?: System.getenv('MURALIS_KEYSTORE_PASSWORD')
            }
        }
        debug {
            // Pinned to the .gradle bind mount instead of letting AGP place it.
            //
            // Not cosmetic: the container runs under --userns=keep-id as a uid with no
            // /etc/passwd entry, so the JVM cannot resolve user.home and AGP's default
            // "~/.android/debug.keystore" landed somewhere ephemeral. It was therefore
            // regenerated on every run, every rebuild produced a differently-signed APK, and
            // `adb install -r` failed with INSTALL_FAILED_UPDATE_INCOMPATIBLE until the app was
            // uninstalled, losing its configuration each time. Observed 2026-08-19.
            //
            // scripts/gradle.sh creates this file with keytool if it is missing. The passwords are
            // Android's well-known debug defaults and are not secrets; a release build must use a
            // real keystore that is not in this repo.
            storeFile file("${rootDir}/.gradle/kiosk-debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    // 36 is Google Play's floor for new apps and updates from 2026-08-31.
    compileSdk 36

    buildFeatures {
        // Off by default since AGP 8, and this project needs it for LICENSE_KEY and PRO_OVERRIDE
        // below. Nothing else uses BuildConfig.
        buildConfig true
    }

    defaultConfig {
        applicationId 'org.spazio17.muralis'

        // 26 is not a guess: the interim kiosk device is a Huawei MediaPad on
        // Android 8.0. This is the whole reason the codebase needs
        // Build.VERSION.SDK_INT branches for setLockTaskFeatures (API 28) and
        // for WindowInsetsController vs SYSTEM_UI_FLAG_* immersive mode (API 30).
        minSdk 26
        targetSdk 36

        versionCode muralisVersionCode
        versionName muralisVersionName

        buildConfigField 'String', 'LICENSE_KEY', "\"${muralisLicenseKey}\""
        buildConfigField 'String', 'PRO_OVERRIDE', "\"${muralisProOverride}\""
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            // Shrunk and obfuscated. Not cosmetic and not premature: the paid unlock is
            // checked in this process, and an unobfuscated entitlement method keeps its
            // name and is a one-line patch. proguard-rules.pro explains what is kept and
            // why, chiefly Paho, which resolves callbacks at runtime.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Only configured when the key is actually present; see signingConfigs.release.
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // A release with no licensing key builds, signs and uploads perfectly, and then no customer
    // can ever unlock Pro, with no error anywhere to say why. Same failure shape as the missing
    // upload-key password the release workflow already refuses, so it is refused the same way:
    // here, where the reason is legible, rather than in a review of why nobody is buying.
    //
    // Only a SIGNED release is refused, which is what separates "shippable" from "reproducible":
    // this repo's stated design is that anyone can build the release variant with no secrets at
    // all (CI does, on every push, and it produces an unsigned APK nobody can ship). The first
    // version of this guard checked the task name alone and broke exactly that build. The
    // keystore being configured is the mark of an artifact headed for users, so it is also the
    // mark of an artifact that must be able to unlock Pro.
    gradle.taskGraph.whenReady { graph ->
        boolean releasing = graph.allTasks.any { it.name.toLowerCase().contains('release') }
        boolean shippable = android.signingConfigs.release.storeFile != null
        if (releasing && shippable && muralisLicenseKey.isEmpty()) {
            throw new GradleException(
                    'MURALIS_LICENSE_KEY is not set, so this signed release could never unlock '
                    + 'Muralis Pro. Take the Base64-encoded RSA public key from Play Console '
                    + '(Monetization setup, Licensing) and pass it in the environment, or unset '
                    + 'the keystore to build an unsigned, non-shippable release.')
        }
        // A key that is present but mispasted (truncated, PEM header lines, the certificate
        // fingerprint instead of the key) ships the exact same unfixable app as a missing one,
        // just without tripping the check above: every purchase verification returns false and
        // nothing anywhere says why. Gradle runs on a JVM, so the key can simply be parsed here,
        // with the same decoder and KeyFactory the app itself will use. Any variant, not only
        // releases: a wrong key in a debug build wastes an afternoon of on-device testing instead.
        if (!muralisLicenseKey.isEmpty()) {
            try {
                java.security.KeyFactory.getInstance('RSA').generatePublic(
                        new java.security.spec.X509EncodedKeySpec(
                                java.util.Base64.decoder.decode(muralisLicenseKey)))
            } catch (Exception notAKey) {
                throw new GradleException('MURALIS_LICENSE_KEY is set but is not a valid '
                        + 'Base64-encoded RSA public key (' + notAKey.message + '). Re-copy it '
                        + 'from Play Console, Monetization setup, Licensing.', notAKey)
            }
        }
    }

    // Host-runnable unit tests for the pure-Java logic
    // (KioskCommandDispatcher, SystemStats, RecyclePolicy, EscapeSequence),
    // matching ../wall-kiosk-rom/scripts/test-host.sh. These must not need a
    // device or an emulator.
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // The ROM vendored Paho under third_party/ because Soong has no dependency
    // resolver. A Gradle build has one, so take the published artifact instead
    // of copying sources across.
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'

    // Play Billing, for the Pro unlock. The 8.x line is the floor Play enforces for every
    // new app and update from 2026-08-31, which is why this starts on 8 rather than 7.
    implementation 'com.android.billingclient:billing:8.3.0'

    testImplementation 'junit:junit:4.13.2'
}
