<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bitcoin clock</title>
<!-- The Bitcoin clock's page: one label cell and six digit cells, the screens in rotation, a flash
     on a new block. The same page is the dashboard on the panel and the preview in the web admin
     and on the panel's Clock options; BitcoinClockPage fills in the fonts and where the state is
     read. Drawn after the open-source block clocks (seven e-paper cells, a two-word label), our
     own drawing: no device frame, no logo. -->
<style>
/*FONTS*/
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'clock-label',sans-serif;
-webkit-user-select:none;user-select:none;cursor:default}
#picture{position:fixed;inset:0;background-size:cover;background-position:center}
#picture::after{content:'';position:absolute;inset:0;background:#000;opacity:var(--dim)}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
justify-content:center;transition:transform 1s}
#stage.top{justify-content:flex-start}#stage.bottom{justify-content:flex-end}
#row{display:flex;gap:var(--gap);align-items:stretch}
.cell{background:var(--cells);border-radius:calc(var(--cw) * .08);width:var(--cw);height:var(--ch);
display:flex;align-items:center;justify-content:center;transition:background .3s,color .3s}
.digit{font-family:var(--digits);font-size:calc(var(--ch) * .78);line-height:1;font-weight:700}
.label{flex-direction:column;font-weight:600;font-size:calc(var(--ch) * .12);letter-spacing:.04em;
text-transform:uppercase;line-height:1.15;text-align:center}
.label .unit{text-transform:none}
.label .one{border-bottom:max(1px,calc(var(--ch) * .012)) solid currentColor;padding-bottom:.08em;
margin-bottom:.08em}
.label svg{width:calc(var(--ch) * .2);height:calc(var(--ch) * .2);margin-bottom:.15em}
body.portrait #row{flex-direction:column}
body.portrait #digits{display:flex;gap:var(--gap)}
body.portrait .label{width:auto;height:calc(var(--ch) * .45);flex-direction:row;gap:.6em;
font-size:calc(var(--ch) * .16)}
body.portrait .label .one{border-bottom:0;border-right:max(1px,calc(var(--ch) * .012)) solid
currentColor;padding:0 .6em 0 0;margin:0}
#digits{display:contents}
.flash .cell{background:var(--accent);color:var(--cells)}
.dash{width:45%;height:6%;background:currentColor;opacity:.45;border-radius:2px}
#strip{position:fixed;left:0;right:0;display:flex;justify-content:space-between;
padding:2.5vh 4vw;font-size:4vh;opacity:.85}
#strip.top{top:0}#strip.bottom{bottom:0}#strip.off{display:none}
#age{position:fixed;right:4vw;bottom:3vh;font-size:2.4vh;opacity:.7;display:none;align-items:center;
gap:.4em}
#age svg{width:1.2em;height:1.2em}
</style></head>
<body>
<div id="picture" hidden></div>
<div id="strip" class="off"><span id="date"></span><span id="clock"></span></div>
<div id="stage"><div id="row"></div></div>
<div id="age"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 16L16 8"/></svg><span></span></div>
<script>
(function(){
var STATE_URL='/*STATE_URL*/',PICTURE_URL='/*PICTURE_URL*/',PREVIEW=/*PREVIEW*/false;
var MONTHS=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
var SYMBOLS={USD:'$',EUR:'€',GBP:'£',CAD:'$',CHF:'F',AUD:'$',JPY:'¥'};
var FONTS={antonio:"'clock-antonio'",oswald:"'clock-oswald'",azeret_mono:"'clock-mono'"};
var SIZES={s:.48,m:.64,l:.8,full:.96};
var CROSSED='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"'
+' stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 16L16 8"/></svg>';
var state=null,options=null,override=null,index=0,shownAt=0,flashUntil=0;
var lastHeight=null,lastPollAt=0,paused=false;
function o(){return override||options;}
function rgb(v){return 'rgb('+v+')';}
function val(id){var v=state&&state.entry&&state.entry.values?state.entry.values[id]:null;
return v&&v.available&&typeof v.value==='number'?v.value:null;}
function currency(){var v=state&&state.entry&&state.entry.values?state.entry.values.price:null;
return v&&v.unit?v.unit:'USD';}
// A number in at most six cells: whole when it fits, else in k, M, B or T with as many
// decimals as fit.
function fit(n){var whole=String(Math.round(n));if(whole.length<=6){return whole;}
var units=[['T',1e12],['B',1e9],['M',1e6],['k',1e3]];
for(var u=0;u<units.length;u++){if(Math.abs(n)>=units[u][1]){
// A value that rounds up to a thousand of this unit is one of the next: 1.00B, not 1000M.
if(u>0&&Math.abs(n/units[u][1])>=999.5){u--;}var x=n/units[u][1];
for(var d=2;d>=0;d--){var s=x.toFixed(d)+units[u][0];if(s.length<=6){return s;}}}}
return whole.slice(0,6);}
function pad2(n){return (n<10?'0':'')+n;}
// Each screen: its two label words and its digits, or null while its value is unknown.
function screen(key){var now=new Date(),c=currency();
switch(key){
case 'height':return val('height')==null?null:['Block','Height',String(val('height'))];
case 'price':return val('price')==null?null:['Price',c,fit(val('price'))];
case 'sats':return val('sats_per_unit')==null?null:['Sats','per '+(SYMBOLS[c]||c),
String(val('sats_per_unit'))];
case 'fee':return val('fee_fast')==null?null:['Fee','sat/vB',String(Math.round(val('fee_fast'))),true];
case 'halving':return val('blocks_to_halving')==null?null:['Halving','in',
String(val('blocks_to_halving'))];
case 'halving_date':if(val('blocks_to_halving')==null){return null;}
// Expected, not promised: a block every ten minutes on average.
var at=new Date(now.getTime()+val('blocks_to_halving')*600000);
return ['Halving',String(at.getFullYear()),pad2(at.getDate())+' '+MONTHS[at.getMonth()]];
case 'market_cap':return val('market_cap')==null?null:['Mcap',c,fit(val('market_cap'))];
case 'supply':return val('supply')==null?null:['Supply','BTC',fit(val('supply'))];
case 'time':return [pad2(now.getDate()),MONTHS[now.getMonth()],pad2(now.getHours())+':'
+pad2(now.getMinutes())];}
return null;}
function onScreens(){return (o().screens||[]).filter(function(s){return s.on;})
.map(function(s){return s.key;});}
function layout(){var opt=o(),portrait=innerHeight>innerWidth*1.1,share=SIZES[opt.size]||.96;
document.body.classList.toggle('portrait',portrait);
var root=document.documentElement.style,gap,cw,ch;
if(portrait){cw=innerWidth*share/6.4;gap=cw*.07;ch=Math.min(cw*1.9,innerHeight*.5);}
else{cw=innerWidth*share/7.45;gap=cw*.075;ch=Math.min(cw*2.1,innerHeight*.8);}
root.setProperty('--cw',cw+'px');root.setProperty('--ch',ch+'px');root.setProperty('--gap',gap+'px');
var stage=document.getElementById('stage');stage.className=opt.position;
stage.style.padding=(innerHeight*.06)+'px 0';}
function paint(){var opt=o();if(!opt){return;}var root=document.documentElement.style;
root.setProperty('--bg',rgb(opt.background));root.setProperty('--cells',rgb(opt.cells));
root.setProperty('--text',rgb(opt.text));root.setProperty('--accent',rgb(opt.accent));
root.setProperty('--digits',FONTS[opt.font]||FONTS.antonio);root.setProperty('--dim',opt.dim/100);
var pic=document.getElementById('picture'),src=opt.picture&&PICTURE_URL?PICTURE_URL
+(PICTURE_URL.indexOf('?')<0?'?':'&')+'p='+encodeURIComponent(opt.picture):'';
pic.hidden=!src;if(src&&pic.dataset.src!==src){pic.dataset.src=src;
pic.style.backgroundImage='url("'+src+'")';}
document.getElementById('strip').className=opt.strip;
var now=new Date();document.getElementById('date').textContent=['Sun','Mon','Tue','Wed','Thu',
'Fri','Sat'][now.getDay()]+' '+now.getDate()+' '+MONTHS[now.getMonth()].charAt(0)
+MONTHS[now.getMonth()].slice(1).toLowerCase();
document.getElementById('clock').textContent=pad2(now.getHours())+':'+pad2(now.getMinutes());
layout();draw();}
// The screen to show: the one in turn, skipping a screen whose value is unknown; null when none
// has a value.
function current(){var keys=onScreens();if(!keys.length){return null;}
for(var tries=0;tries<keys.length;tries++){var k=keys[(index+tries)%keys.length],s=screen(k);
if(s){index=(index+tries)%keys.length;return s;}}return null;}
function draw(){var row=document.getElementById('row'),s=current(),age=document.getElementById('age');
var label,digits;
if(s){label='<span class="one">'+s[0]+'</span><span'+(s[3]?' class="unit"':'')+'>'+s[1]+'</span>';
digits=s[2];}
else{var first=onScreens()[0]||'height';label=CROSSED+'<span>'+(screenWord(first))+'</span>';digits=null;}
// Whenever the data is not fresh the line says so, also while the time still shows.
var ok=state&&state.entry&&state.entry.enabled&&state.entry.state==='ok';
if(!ok){var line=state&&state.entry?(state.entry.enabled?(state.age_s!=null?'No answer for '
+Math.max(1,Math.round(state.age_s/60))+' min':state.entry.status):'Bitcoin clock is off')
:'Waiting for the panel';age.lastChild.textContent=line;}
age.style.display=ok?'none':'flex';
var html='<div class="cell label">'+label+'</div><div id="digits">';
var chars=digits==null?[]:Array.from(digits);
for(var i=0;i<6;i++){var ch=chars.length-6+i>=0?chars[chars.length-6+i]:'';
html+='<div class="cell digit">'+(digits==null?'<span class="dash"></span>':(ch===' '?'':ch))+'</div>';}
row.innerHTML=html+'</div>';
document.body.classList.toggle('flash',Date.now()<flashUntil);}
function screenWord(key){return {height:'Height',price:'Price',sats:'Sats',fee:'Fee',
halving:'Halving',halving_date:'Halving',market_cap:'Mcap',supply:'Supply',time:'Time'}[key]||'';}
function next(step){var keys=onScreens();if(!keys.length){return;}
index=(index+step+keys.length)%keys.length;
// Skip forward or back past screens with nothing to show.
for(var t=0;t<keys.length&&!screen(keys[index]);t++){index=(index+(step<0?-1:1)+keys.length)%keys.length;}
shownAt=Date.now();draw();}
function flash(){var keys=onScreens();var h=keys.indexOf('height');if(h>=0){index=h;}
flashUntil=Date.now()+3000;shownAt=Date.now();draw();setTimeout(draw,3050);}
function tick(){var opt=o();if(!opt||paused){return;}
if(Date.now()-shownAt>=opt.seconds*1000){next(1);}else{draw();}
paintClock();}
function paintClock(){var now=new Date();document.getElementById('clock').textContent=
pad2(now.getHours())+':'+pad2(now.getMinutes());}
function poll(){if(paused){return;}fetch(STATE_URL,{cache:'no-store',credentials:'same-origin'})
.then(function(r){return r.json();}).then(function(next){var was=lastHeight,polledAt=lastPollAt;
state=next;options=next.options;lastPollAt=Date.now();
var h=val('height');
// A new block flashes only when it is seen live: the last look was moments ago and it is the
// very next block, so a block found while the panel slept, the page was away or the source was
// down is shown, never replayed (no backlog).
if(h!=null&&was!=null&&h===was+1&&lastPollAt-polledAt<10000&&o().flash
&&document.visibilityState==='visible'){flash();}
if(h!=null){lastHeight=h;}paint();}).catch(function(){state=null;draw();});}
// Against burn-in: the whole page moves a few pixels every minute, back and forth within 8 px.
function shift(){var x=Math.round(Math.random()*16-8),y=Math.round(Math.random()*16-8);
document.getElementById('stage').style.transform='translate('+x+'px,'+y+'px)';
document.getElementById('strip').style.transform='translate('+x+'px,'+y+'px)';}
// The previews: the options being edited, and the buttons beside them.
function command(data){if(!data){return;}
if(data.options){override=data.options;paint();}
if(data.step){next(data.step);}if(data.flash){flash();}
// Unseen (the display off, Ambient, the settings in front): no asking and no drawing until seen.
if(data.paused!=null){var was=paused;paused=!!data.paused;if(was&&!paused){poll();}}}
window.addEventListener('message',function(e){if(e.origin===location.origin){command(e.data);}});
window.clockPreview=command;
addEventListener('resize',function(){layout();draw();});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){poll();}});
poll();setInterval(poll,PREVIEW?5000:2000);setInterval(tick,1000);
if(!PREVIEW){setInterval(shift,60000);}
shownAt=Date.now();
})();
</script>
</body></html>
